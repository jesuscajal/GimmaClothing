# PostgreSQL y Redis para desarrollo local de Gimma Clothing.
# Requiere Docker Desktop: https://www.docker.com/products/docker-desktop/
#
# Iniciar:  docker compose up -d
# Detener:  docker compose down
# Logs:    docker compose logs -f

services:
  postgres:
    image: postgres:15-alpine
    container_name: gimma_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: medusa-store
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - gimma_postgres_data:/var/lib/postgresql/data
    networks:
      - gimma_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medusa-store"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gimma_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - gimma_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  gimma_postgres_data:

networks:
  gimma_network:
    driver: bridge
